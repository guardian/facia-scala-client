name: CI
on:
  workflow_dispatch:
  pull_request:

  # triggering CI default branch improves caching
  # see https://docs.github.com/en/free-pro-team@latest/actions/guides/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
  push:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to interact with GitHub's OIDC Token endpoint
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v6 # Needed for S3 read access for the tests!
        with:
          # This is a temp change, to avoid updating the original value until tested
          role-to-assume: ${{ secrets.AWS_ROLE_FOR_TESTS_UPDATED }}
          aws-region: eu-west-1
      - uses: guardian/setup-scala@v2
      - name: Build and Test
        run: sbt -v scalafmtCheckAll +test
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test-results/**/TEST-*.xml"
        if: always()
